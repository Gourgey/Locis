# Fetches D-TRO data, rebuilds the map tiles and publishes them to GitHub Pages.
# Needs two repository secrets: DTRO_CLIENT_ID and DTRO_CLIENT_SECRET.
# See docs/DEPLOYMENT.md.
name: Publish parking data

on:
  schedule:
    - cron: "17 3 * * *" # every day at 03:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Run a full import instead of an incremental sync"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the pipeline
        run: pip install ./pipeline

      # The working database (raw D-TRO payloads and the sync checkpoint) is kept
      # between runs so most days only changes are fetched. If the cache is gone,
      # the pipeline runs a full import instead.
      - name: Restore working database
        uses: actions/cache@v4
        with:
          path: pipeline/var
          key: locis-db-${{ github.run_id }}
          restore-keys: locis-db-

      - name: Update data and build tiles
        env:
          DTRO_CLIENT_ID: ${{ secrets.DTRO_CLIENT_ID }}
          DTRO_CLIENT_SECRET: ${{ secrets.DTRO_CLIENT_SECRET }}
          LOCIS_DB: pipeline/var/locis.sqlite
          LOCIS_OUT: pipeline/dist
        run: |
          if [ -z "$DTRO_CLIENT_ID" ] || [ -z "$DTRO_CLIENT_SECRET" ]; then
            echo "::error::Add the DTRO_CLIENT_ID and DTRO_CLIENT_SECRET repository secrets (docs/DEPLOYMENT.md)."
            exit 1
          fi
          # A full import every Sunday reconciles anything the event feed missed.
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            locis publish --full
          else
            locis publish
          fi
          locis status

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pipeline/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
