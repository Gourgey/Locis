# Fetches D-TRO data, rebuilds the map tiles and publishes them to GitHub Pages.
# Needs two repository secrets: DTRO_CLIENT_ID and DTRO_CLIENT_SECRET.
# See docs/DEPLOYMENT.md.
name: Publish parking data

on:
  schedule:
    # Weekly until the app is released; "17 3 * * *" makes it daily again.
    - cron: "17 3 * * 0" # every Sunday at 03:17 UTC
  workflow_dispatch:
    inputs:
      full:
        description: "Run a full import instead of an incremental sync"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write # lets the job keep its own schedule enabled (see "Keep the schedule alive")

concurrency:
  group: publish-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.credentials.outputs.ready }}
    steps:
      # Until the D-TRO credentials are added as secrets there is nothing to do:
      # finish quietly instead of failing every run.
      - name: Check for D-TRO credentials
        id: credentials
        env:
          DTRO_CLIENT_ID: ${{ secrets.DTRO_CLIENT_ID }}
          DTRO_CLIENT_SECRET: ${{ secrets.DTRO_CLIENT_SECRET }}
        run: |
          if [ -n "$DTRO_CLIENT_ID" ] && [ -n "$DTRO_CLIENT_SECRET" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No D-TRO credentials yet. Add the DTRO_CLIENT_ID and DTRO_CLIENT_SECRET secrets (docs/DEPLOYMENT.md)."
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.ready == 'true'
        with:
          python-version: "3.13"

      - name: Install the pipeline
        if: steps.credentials.outputs.ready == 'true'
        run: pip install ./pipeline

      # The working database (raw D-TRO payloads and the sync checkpoint) is kept
      # between runs so a run by hand only fetches changes. If the cache is gone,
      # the pipeline runs a full import instead.
      - name: Restore working database
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: pipeline/var
          key: locis-db-${{ github.run_id }}
          restore-keys: locis-db-

      - name: Update data and build tiles
        if: steps.credentials.outputs.ready == 'true'
        env:
          DTRO_CLIENT_ID: ${{ secrets.DTRO_CLIENT_ID }}
          DTRO_CLIENT_SECRET: ${{ secrets.DTRO_CLIENT_SECRET }}
          LOCIS_DB: pipeline/var/locis.sqlite
          LOCIS_OUT: pipeline/dist
        run: |
          # The scheduled Sunday run is a full import, which reconciles anything the
          # event feed missed.
          if [ "${{ inputs.full }}" = "true" ] || [ "$(date -u +%u)" = "7" ]; then
            locis publish --full
          else
            locis publish
          fi
          locis status

      # GitHub switches off scheduled workflows in a public repository after 60
      # days with no repository activity. Publishing data makes no commits, so the
      # job re-enables itself, which resets that timer.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish-data.yml/enable"

      - uses: actions/upload-pages-artifact@v3
        if: steps.credentials.outputs.ready == 'true'
        with:
          path: pipeline/dist

  deploy:
    needs: build
    if: needs.build.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
