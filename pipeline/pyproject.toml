[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locis-pipeline"
version = "0.1.0"
description = "Fetches UK D-TRO data, normalises parking provisions and publishes static map tiles for the Locis iOS app."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyproj>=3.6",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.20"]

[project.scripts]
locis = "locis_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
locis_pipeline = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
